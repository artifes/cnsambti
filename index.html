<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNSA 성격 유형 검사 및 스트레스 유형 검사</title>
    <style>
        /* 기본 스타일 셋업 */
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-color);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* 버튼 및 선택지 스타일 */
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        button:hover { background-color: #357abd; }
        
        .answer-btn {
            display: block;
            width: 100%;
            background: #f0f4f8;
            color: #333;
            text-align: left;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 15px;
            border: 1px solid #e1e8ed;
        }
        .answer-btn:hover {
            background: #e1f5fe;
            border-color: var(--primary-color);
        }
        
        /* 진행바 */
        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            width: 0%;
            height: 10px;
            background-color: var(--primary-color);
            transition: width 0.3s;
        }
        
        /* 결과 페이지 스타일 */
        .result-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .result-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="screen active">
        <h2>🏫 CNSA 성격 유형 & 스트레스 검사</h2>
        <p>충남삼성고 속 나의 행동과 스트레스 유형을 알아보자!</p>
        <button onclick="startQuiz()">테스트 시작하기</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        <h3 id="question-text">질문 텍스트</h3>
        <div id="answer-buttons"></div>
    </div>

    <div id="result-screen" class="screen">
        <h2>🎉 테스트 결과 🎉</h2>
        
        <div class="result-box">
            <div id="mbti-title" class="result-title">성격 유형 데이터</div>
            <p id="mbti-summary" style="font-weight: bold;"></p>
            <div id="mbti-facilities"></div>
            <hr>
            <h4>주요 특징</h4>
            <p id="mbti-features" style="white-space: pre-line;"></p>
            <h4>주의해야 할 점</h4>
            <p id="mbti-warn" style="white-space: pre-line;"></p>
        </div>

        <div class="result-box">
            <div id="stress-title" class="result-title">스트레스 유형 데이터</div>
            <h4>정의 및 대처 방법</h4>
            <p id="stress-desc" style="white-space: pre-line;"></p>
        </div>

        <div class="result-box" style="border-left: 5px solid #4af2a1;">
            <div class="result-title" style="color: #2e7d32;">🤝 나의 환상의 짝꿍</div>
            <p id="partner-info" style="white-space: pre-line;"></p>
        </div>

        <button onclick="restartQuiz()">다시 테스트하기</button>
    </div>
</div>

<script>
    // 질문 데이터 정의
    const questions = [
        { q: "Q1. 드디어 기다리던 청성제! 당신이 가장 설레거나 참여하고 싶은 역할은?", a: [{text:"화려한 무대(충무관) 위에서 내 끼와 연습한 결과물을 완벽하게 보여주기", type:"C"}, {text:"청성제 기획단에 들어가 축제 전반을 조율하고, 비즈쿨 부스 운영하기", type:"N"}, {text:"최신 장비나 IT 기술을 활용해 학생들에게 도움이 되는 청성제용 사이트 만들기", type:"S"}, {text:"청성제의 감성적인 분위기를 녹여낸 홍보뮤비 만들기", type:"A"}]},
        { q: "Q2. 큰 비중이 걸린 수행평가 조별 과제가 시작되었다. 당신이 조에서 자진해서 맡는 포지션은?", a: [{text:"묵묵하고 끈기 있게 자료를 조사하고 채워 넣으며, 마지막까지 PPT를 완성하는 역할", type:"C"}, {text:"\"너는 이거 하고, 너는 이거 해!\" 조원들의 장점을 파악해 역할을 나누고 일정을 체크하며 전체를 이끄는 역할", type:"N"}, {text:"조원들이 하는 주장에 논리적 오류나 허점이 없는지 칼같이 잡아내는 역할", type:"S"}, {text:"발표의 전체적인 흐름을 매끄러운 스토리로 다듬는 메인 발표자 역할", type:"A"}]},
        { q: "Q3. 시험 기간, 면학실에 앉아 공부를 하던 중 예상치 못한 난관에 부딪혔을 때 당신은?", a: [{text:"\"내가 이기나 네가 이기나 해보자.\" 이해가 될 때까지 혼자 파고든다.", type:"C"}, {text:"\"얘들아, 이거 어떻게 풀어?ㅠㅠ“ 친구들에게 물어보거나 잘하는 애를 찾아가서 힌트를 얻는다.", type:"N"}, {text:"답지를 펼쳐서 철저하게 문제를 분석한 뒤, 가장 효율적인 풀이법을 찾아낸다.", type:"S"}, {text:"지금 내 마음을 가라앉히는 게 우선! 잠깐 복도 바람을 쐬며 멘탈을 먼저 케어한다.", type:"A"}]},
        { q: "Q4. 평소 관심 있던 분야에 대해 심화 탐구 보고서를 써야 한다. 당신이 주제를 정하는 기준은?", a: [{text:"시간이 오래 걸리고 과정이 힘들더라도, 나만의 깊이 있는 학업적 역량을 증명할 수 있는 고난도 주제", type:"C"}, {text:"인문학과 자연과학을 연결하거나, 최근 트렌드와 사회적 이슈를 엮어낼 수 있는 흥미로운 융합 주제", type:"N"}, {text:"구체적인 실험과 수치 데이터, 혹은 통계를 통해 확실한 결과와 근거를 도출할 수 있는 과학적 주제", type:"S"}, {text:"인간의 심리, 문화, 언어 등 사람들의 삶과 마음에 와닿고 깊은 울림을 줄 수 있는 인문사회학적 주제", type:"A"}]},
        { q: "Q5. 친구가 다가와 울적한 표정으로 \"나 이번 시험 열심히 준비했는데 완전히 망쳤어...\"라고 말할 때, 당신의 리액션은?", a: [{text:"다음 시험에 만회하면 돼~ 나랑 같이 다음 계획 짜보자! (위로와 함께 극복 계획 제시)", type:"C"}, {text:"진짜 속상해서 어떡해ㅠㅠ... 기분 전환하게 맛있는 거 먹으러 갈래? 내가 다른 애들도 부를까?(분위기 전환과 환경 환기)", type:"N"}, {text:"어떤 과목이 문젠데? 실수가 많았던 거야, 공부 방향이 틀렸던 거야?(실패 원인 분석 돕기)", type:"S"}, {text:"헐... 진짜 속상하겠다. 네가 얼마나 밤새워 노력했는지 내가 다 아는데... (말없이 안아주며 폭풍 공감)", type:"A"}]},
        { q: "Q6. 기숙사 점호 시간이 다 되어가는데, 오늘따라 유독 과제와 수행평가가 심하게 밀려 스트레스가 정점을 찍었다. 이때 나의 상태는?", a: [{text:"룸메가 말을 걸거나 바스락거리는 소리만 내도 짜증이 확 난다.", type:"폭발"}, {text:"기숙사 침대에 들어가 이불을 머리 끝까지 뒤집어쓴 채 현실과 거리두기를 한다.", type:"동굴"}, {text:"머릿속에 할 일들이 떠다녀 기숙사 소등 후에도 스탠드를 켜고 동동거리지만, 정작 불안해서 진도가 안 나간다.", type:"과부하"}, {text:"아 몰라 어떻게든 되겠지… 그냥 쓰러져 잠만 자고 싶다.", type:"무기력"}]},
        { q: "Q7. 스트레스를 잔뜩 안고 자판기 앞으로 갔다. 그런데 하필 내가 뽑으려던 음료가 품절이거나 자판기가 돈을 먹었을 때, 나의 리액션은?", a: [{text:"아, 진짜 왜 이래?! 자판기 반환구를 탁탁 쳐본다.", type:"폭발"}, {text:"누군가와 마주치거나 말 섞기 싫어서 그냥 깊은 한숨을 한 번 쉬고 조용히 자리를 뜬다.", type:"동굴"}, {text:"왜 하필 지금 이러지? 돈 돌려받으려면 행정실에 가야 하나? 안 그래도 복잡한 머릿속에 할 일이 하나 더 늘어난 것 같아 멘탈이 혼란해진다.", type:"과부하"}, {text:"짜증을 낼 기운조차 없어서 멍하니 자판기를 바라보다가 털레털레 걸어 나온다.", type:"무기력"}]},
        { q: "Q8. 오늘 급식실 메뉴가 내가 정말 싫어하는 음식이거나, 줄이 너무 길어서 스트레스가 극에 달했을 때 내가 취할 행동은?", a: [{text:"오늘 급식 진짜 에바다... 라며 주변 친구들에게 불만을 토로하고 자판기로 간다.", type:"폭발"}, {text:"급식실의 분위기조차 스트레스라, 대충 몇 숟가락만 빨리 먹고 면학실이나 기숙사로 대피한다.", type:"동굴"}, {text:"밥을 먹으면서도 “이거 빨리 먹고 가서 면학실 가서 과제 해야 하는데...\" 하며 시간 계산을 하느라 밥이 입으로 들어가는지 코로 들어가는지 모른다.", type:"과부하"}, {text:"줄 서는 것도 귀찮고 먹는 것도 귀찮아서 그냥 밥을 굶거나 대충 때운다.", type:"무기력"}]},
        { q: "Q9. 면학실에 앉아 공부를 하려는데, 안 그래도 스트레스가 가득한 상황에서 주변의 소음(책장 넘기는 소리, 기침 소리 등)이 계속 거슬린다면?", a: [{text:"소리가 나는 쪽을 날카로운 눈빛으로 쳐다보거나, 내 필기구를 일부러 탁탁 소리 내며 불편한 심기를 대놓고 표출한다.", type:"폭발"}, {text:"노이즈 캔슬링을 하거나, 아예 짐을 싸서 스탠딩으로 자리를 옮긴다.", type:"동굴"}, {text:"‘소리 때문에 집중이 안 되네, 오늘 계획 망했다...'라며 주변 소음에 신경을 쓰느라 정작 책은 한 페이지도 못 넘기고 안절부절못한다.", type:"과부하"}, {text:"짜증을 내거나 자리를 옮길 의욕도 없다. 그냥 멍을 때린다.", type:"무기력"}]},
        { q: "Q10. 일주일 동안 기숙사 생활을 하며 온갖 스트레스를 견뎌내고 드디어 금요일 귀가! 내가 스트레스를 해소하는 방식은?", a: [{text:"친구나 가족에게 일주일 동안 학교에서 있었던 억울하고 빡쳤던 일들을 쏟아내며 스트레스를 푼다.", type:"폭발"}, {text:"이어폰을 낀 채 집에 도착할 때까지 누구의 방해도 받지 않고 혼자만의 세상에 잠긴다.", type:"동굴"}, {text:"집에 가는 길에도 주말 동안 집에서 해야 할 수행평가와 학원 숙제 스케줄러를 정리하며 끊임없이 머리를 굴린다.", type:"과부하"}, {text:"출발하자마자 기절하듯 잠들어서 집에 도착할 때까지 세상모르고 시체처럼 잔다.", type:"무기력"}]}
    ];

    // 결과 텍스트 데이터 mapping
    const mbtiData = {
        C: { title: "C형 (Creativity) : 창의적인 몰입가", summary: "목표를 정하면 끝까지 파고드는 집중력과 열정이 가득한 사람", facilities: ["특별교과동 (C동)", "면학실", "갤럭시홀", "학생회실", "동아리실"], features: "- 뛰어난 집중력과 강한 인내심을 가짐\n- 꼼꼼하게 계획을 세우고 이를 잘 실천함\n- 눈에 보이는 결과물을 만들어내는 것을 좋아함", warn: "- 한번 몰입하면 그것만 끝날 때까지 팜\n- 계획이 틀어지면 스트레스를 많이 받음\n- 일에 치여 자신을 잘 돌보지 못할 때가 있음", partner: "**A형 (감성적인 표현가)**\n언어와 공감을 바탕으로 사람들과 소통하는 사람" },
        N: { title: "N형 (Networking) : 융합형 연결자", summary: "학교의 다양한 분야를 연결하며 새로운 아이디어를 만들어내는 사람", facilities: ["행정동 (N동)", "다산관", "중앙계단", "홈베이스", "카페 다움", "기술실"], features: "- 넓은 대인관계와 빠른 정보 수집력을 지님\n- 갈등 상황에서 여러 의견을 조율하며 해결책을 찾음\n- 다양한 분야의 정보를 습득하고 공유하는 것을 좋아함", warn: "- 여러 일에 관심이 많아 가끔 피곤해질 수 있음\n- 폭넓게 보는 것에는 강하지만, 깊이 있는 탐구가 부족할 때도 있음", partner: "**S형 (논리적인 분석가)**\n근거와 분석을 바탕으로 문제를 해결하는 사람" },
        S: { title: "S형 (Science) : 논리적인 분석가", summary: "근거와 분석을 바탕으로 문제를 해결하는 사람", facilities: ["자연과학동 (S동)", "IT공학실", "화학실험실", "생물실험실", "물리실", "첨단기기실"], features: "- 사실과 근거를 바탕으로 생각하는 것을 좋아함\n- 궁금한 점을 직접 확인하고 탐구하는 것을 좋아함\n- 목표가 뚜렷하고 한 분야를 깊게 파고듦", warn: "- 인간관계에서도 감정보다 객관적인 판단을 우선할 때가 있음\n- 자신의 생각을 솔직하게 표현하다 상대방을 서운하게 할 수 있음", partner: "**N형 (융합형 연결자)**\n학교의 다양한 분야를 연결하며 새로운 아이디어를 만들어내는 사람" },
        A: { title: "A형 (Art & Language) : 감성적인 표현가", summary: "언어와 공감을 바탕으로 사람들과 소통하는 사람", facilities: ["인문사회동 (A동)", "글로벌라운지", "문과감성교실", "로고스랩"], features: "- 다른 사람의 감정과 생각을 잘 이해함\n- 말과 글을 통해 자신의 생각을 효과적으로 전달함\n- 창의적인 아이디어를 내고 표현하는 것을 좋아함", warn: "- 주변 분위기나 평가에 영향을 많이 받는 편임\n- 다른 사람을 배려하다가 자신의 의견을 표현하지 못할 때가 있음", partner: "**C형 (창의적인 몰입가)**\n목표를 정하면 끝까지 파고드는 집중력과 열정이 가득한 사람" }
    };

    const stressData = {
        폭발: { title: "💥 폭발형 : 주변에 스트레스를 분출한다.", desc: "마음대로 일이 풀리지 않거나 억울한 상황에 직면하면 외부로 방출하는 유형임. 욱하는 순간이 오면 일단 말을 멈추고 깊생을 하며 이성회로가 돌아올때까지 시간을 벌어줘야 함. 좋아하는 음식을 먹거나 소리를 지르거나 몸을 격렬하게 움직여서 내부에 쌓인 스트레스를 안전하게 해소하는 것을 추천함." },
        동굴: { title: "🦇 동굴형 : 내 아늑한 동굴로 스스슥,,", desc: "스트레스가 과부하되면 모든 연락을 무음으로 돌리고 주변과의 소통을 완전차단함. 힘든 상태에서 다른 사람의 간섭까지 받으면 그게 더 스트레스라 이때는 철저하게 혼자만의 아늑한 시간과 공간을 확보하는게 최선임." },
        과부하: { title: "🌀 과부하형 : 생각이 뭉게뭉게.. 점점 제자리를 돈다", desc: "해야할 일은 산더미인데 극심한 불안감 때문에 손에 아무것도 잡히지 않아 발만 동동 구르게 됨. 마감 기한이 다가오거나 능력 밖의 일이 몰릴 때 무너지기 쉬움. 할 일을 쪼개서 제일 쉬운 일부터 하나씩 차근차근 해결해 나가야 함. 화이팅.." },
        무기력: { title: "🪫 무기력형 : 배터리 0%", desc: "배터리가 모두 소진되어 만사가 귀찮고 침대에 누워서 잠만 자며 상황을 회피하려고 하는 유형임. 아무리 노력해도 상황이 나아지지 않는다고 느낄 때 깊은 무기력에 빠지게 되므로 이때는 스스로를 채찍질하기보단 죄책감 없는 완벽한 휴식을 나에게 제공해야 함. 가벼운 산책으로 햇빛을 쬐거나 따뜻한 물로 샤워를 하는 등 에너지를 바닥에서부터 충전해야함." }
    };

    // 상태 변수
    let currentIdx = 0;
    let scores = { C:0, N:0, S:0, A:0, 폭발:0, 동굴:0, 과부하:0, 무기력:0 };

    function startQuiz() {
        currentIdx = 0;
        scores = { C:0, N:0, S:0, A:0, 폭발:0, 동굴:0, 과부하:0, 무기력:0 };
        showScreen("quiz-screen");
        showQuestion();
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showQuestion() {
        const progress = (currentIdx / questions.length) * 100;
        document.getElementById("progress").style.width = `${progress}%`;

        if(currentIdx >= questions.length) {
            showResult();
            return;
        }

        const currentQ = questions[currentIdx];
        document.getElementById("question-text").innerText = currentQ.q;
        
        const btnContainer = document.getElementById("answer-buttons");
        btnContainer.innerHTML = "";
        
        currentQ.a.forEach(ans => {
            const btn = document.createElement("button");
            btn.className = "answer-btn";
            btn.innerText = ans.text;
            btn.onclick = () => {
                scores[ans.type]++;
                currentIdx++;
                showQuestion();
            };
            btnContainer.appendChild(btn);
        });
    }

    function showResult() {
        // 최대 점수 유형 찾기 함수
        const getResultType = (types) => types.reduce((a, b) => scores[a] >= scores[b] ? a : b);

        const finalMbti = getResultType(['C', 'N', 'S', 'A']);
        const finalStress = getResultType(['폭발', '동굴', '과부하', '무기력']);

        // 성격 유형 매핑
        const mbti = mbtiData[finalMbti];
        document.getElementById("mbti-title").innerText = mbti.title;
        document.getElementById("mbti-summary").innerText = mbti.summary;
        
        // 시설 태그 생성
        const facContainer = document.getElementById("mbti-facilities");
        facContainer.innerHTML = "<h4>🏢 모티브 건물 및 핵심 시설</h4>";
        mbti.facilities.forEach(f => {
            facContainer.innerHTML += `<span class="tag">${f}</span>`;
        });

        document.getElementById("mbti-features").innerText = mbti.features;
        document.getElementById("mbti-warn").innerText = mbti.warn;
        document.getElementById("partner-info").innerText = mbti.partner;

        // 스트레스 유형 매핑
        const stress = stressData[finalStress];
        document.getElementById("stress-title").innerText = stress.title;
        document.getElementById("stress-desc").innerText = stress.desc;

        showScreen("result-screen");
    }

    function restartQuiz() {
        showScreen("start-screen");
    }
</script>
</body>
</html>
